{{ define "configuration-row" }}
  <tr>
    <td>{{ .CarModel }}</td>
    <td>{{ .Name }}</td>
    <td>{{ .Price }}</td>
    <td>{{ .DeliveryDays }}</td>
    <td>{{ if .Description }}{{ .Description }}{{ end }}</td>
    <td>{{ .OrderCount }}</td>
    <td>
      <form
        method="get"
        action="/admin/configurations/edit"
        hx-get="/admin/configurations/edit"
        hx-target="closest tr"
        hx-swap="outerHTML"
      >
        <input type="hidden" name="id" value="{{ .ID }}" />
        <button>Изменить</button>
      </form>
    </td>
    <td>
      <form
        method="post"
        action="/admin/configurations/delete"
        hx-post="/admin/configurations/delete"
        hx-swap="none"
      >
        <input type="hidden" name="id" value="{{ .ID }}" />
        {{ if gt .OrderCount 0 }}
          <span title="Нельзя удалить комплектацию: для неё есть заказы">
            <button class="secondary" disabled>Удалить</button>
          </span>
        {{ else }}
          <button class="secondary">Удалить</button>
        {{ end }}
      </form>
    </td>
  </tr>
{{ end }}
