{{ define "model-row" }}
  <tr>
    <td>{{ .Name }}</td>
    <td>{{ .Year }}</td>
    <td>{{ .OrderCount }}</td>
    <td>
      <form
        method="get"
        action="/admin/models/edit"
        hx-get="/admin/models/edit"
        hx-target="closest tr"
        hx-swap="outerHTML"
      >
        <input type="hidden" name="name" value="{{ .Name }}" />
        <button>Изменить</button>
      </form>
    </td>
    <td>
      <form
        method="post"
        action="/admin/models/delete"
        hx-post="/admin/models/delete"
        hx-swap="none"
      >
        <input type="hidden" name="name" value="{{ .Name }}" />
        {{ if gt .OrderCount 0 }}
          <span title="Нельзя удалить модель: для её комплектаций есть заказы">
            <button class="secondary" disabled>Удалить</button>
          </span>
        {{ else }}
          <button class="secondary">Удалить</button>
        {{ end }}
      </form>
    </td>
  </tr>
{{ end }}
