{{define "title"}}{{.Title}} — Автосалон{{end}} {{define "main"}}
<h1>{{.Title}}</h1>
<p><a href="/">Вернуться к спискам</a></p>
{{if .Error}}
<p role="alert">{{.Error}}</p>
{{end}}
<form method="post" action="{{.Action}}">
  {{if .IsEdit}}<input
    type="hidden"
    name="old_name"
    value="{{.OldName}}"
  />{{end}}
  <label for="name">Название модели</label>
  <input id="name" name="name" value="{{.Name}}" required />

  <label for="year">Год выпуска</label>
  <input
    id="year"
    name="year"
    type="number"
    min="1"
    max="9999"
    value="{{.Year}}"
    required
  />

  <button type="submit">Сохранить</button>
</form>
{{end}}
